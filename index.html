<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test Apps</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111827;
        color: #f9fafb;
      }
      main {
        width: min(640px, calc(100vw - 2rem));
        background: #1f2937;
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
      }
      ul {
        margin: 0;
        padding-left: 1.25rem;
      }
      li + li {
        margin-top: 0.75rem;
      }
      a {
        color: #facc15;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Applications du repo</h1>
      <ul>
        <li><a href="math/">Oui ou Non</a></li>
        <li><a href="drapeaux/">Le jeu des drapeaux</a></li>
      </ul>
    </main>
  </body>
</html>
