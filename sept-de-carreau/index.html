<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Le 7 de carreau</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <!-- En portrait tout est empilé ; en paysage : table à gauche, main à droite -->
    <div class="col col-table">
    <header class="top">
      <a class="home" href="../">← Accueil</a>
      <h1>Le 7 de carreau</h1>
    </header>

    <!-- Les bots : nom + nombre de cartes restantes -->
    <ul class="bots" id="bots" aria-label="Adversaires"></ul>

    <!-- La table : une rangée par couleur, de l’As (bas) au Roi puis l’As (haut) -->
    <section class="board" id="board" aria-label="Table"></section>
    </div>

    <div class="col col-hand">

    <p class="status" id="status" aria-live="polite"></p>

    <!-- Choix du nombre de bots, au début et à la fin de chaque partie -->
    <section class="setup" id="setup">
      <p class="setup-title">Contre combien de bots veux-tu jouer&nbsp;?</p>
      <div class="choices" id="bot-choices"></div>
    </section>

    <div class="actions">
      <button class="btn btn-ask" id="btn-ask" type="button" hidden>Demander une carte</button>
    </div>

    <!-- La main du joueur -->
    <section class="hand-zone">
      <p class="hand-title">Ta main <span id="hand-count"></span></p>
      <div class="hand" id="hand" aria-label="Ta main"></div>
    </section>
    </div>
  </main>

  <script src="rules.js"></script>
  <script src="game.js"></script>
</body>
</html>
